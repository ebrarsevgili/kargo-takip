<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kargo Takip</title>
  <meta name="description" content="Takip numaranla kargonun nerede olduğunu gör.">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-narrow">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark"></span>Kargo Takip</a>
      <nav><a class="btn btn-sm" href="login.html">Giriş yap</a></nav>
    </header>

    <section class="track-hero">
      <h1>Kargon şu an nerede?</h1>
      <p>Takip numaranı gir. Gönderinin hangi aşamada olduğunu ve nerelerden geçtiğini burada görürsün.</p>
      <form id="track-form" class="track-form" novalidate>
        <div class="field">
          <label for="tracking-number">Takip numarası</label>
          <input id="tracking-number" name="tracking-number" placeholder="KT1234567890" maxlength="12"
                 autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="tracking-error">
          <div id="tracking-error" class="field-error hidden" role="alert"></div>
        </div>
        <button type="submit" id="track-button" class="btn btn-primary">Sorgula</button>
      </form>
    </section>

    <div id="result" class="result" aria-live="polite"></div>
  </div>

  <script type="module" src="track.js"></script>
</body>
</html>
